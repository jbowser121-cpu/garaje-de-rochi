<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Opiniones de clientes — El Garaje de Rochi</title>
<link rel="icon" href="/garaje.ico" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .op { max-width: 760px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 60px; }
  .op .top a { color: var(--teal-deep); text-decoration:none; font-weight:600; font-size:14px; }
  .op h1 { font-size: clamp(24px, 6vw, 34px); color: var(--ink); margin:.2em 0; }
  .op .lead { color: var(--muted); margin-bottom: 14px; }
  .stats { display:flex; flex-wrap:wrap; gap:12px; margin: 10px 0 20px; }
  .stat { flex:1 1 120px; background: var(--white); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; text-align:center; }
  .stat b { display:block; font-size:26px; color: var(--teal-deep); }
  .stat span { font-size:12.5px; color: var(--muted); }
  .cards { display:grid; gap:12px; }
  .rev { background: var(--white); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding:16px 18px; }
  .rev__head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .rev__avatar { width:38px; height:38px; border-radius:50%; background: var(--mint); color: var(--teal-deep);
    display:grid; place-items:center; font-weight:800; }
  .rev__name { font-weight:700; color: var(--ink); }
  .rev__stars { color:#ffc531; font-size:15px; letter-spacing:1px; }
  .rev__date { margin-left:auto; font-size:12px; color: var(--muted); }
  .rev__text { color: var(--ink); line-height:1.5; }
  .rev__badge { display:inline-block; font-size:11px; font-weight:700; color: var(--teal-deep);
    background: var(--mint); border-radius:999px; padding:2px 8px; margin-top:8px; }
  .empty { text-align:center; color: var(--muted); padding:40px 10px; }
  .cta-row { display:flex; flex-wrap:wrap; gap:10px; margin: 6px 0 20px; }
  .verif { font-size:12.5px; color: var(--muted); display:inline-flex; gap:6px; align-items:center; margin-bottom:14px; }
</style>
</head>
<body>
<div class="op">
  <div class="top"><a href="/">← Ir a la tienda</a></div>
  <h1>Opiniones de nuestros clientes</h1>
  <p class="lead">Lo que dicen quienes ya compraron en El Garaje de Rochi.</p>
  <div class="verif">✅ Opiniones verificadas: cada una se revisa antes de publicarse.</div>

  <div class="cta-row">
    <a class="btn btn--primary" href="/opinar">✍️ Dejar mi opinión</a>
    <a class="btn btn--ghost" href="/devoluciones">Cambios y devoluciones</a>
  </div>

  <div class="stats" id="stats" style="display:none"></div>
  <div class="cards" id="cards"></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const estrellas = (n) => n ? "★".repeat(n) + "☆".repeat(5 - n) : "";
  const fecha = (s) => { try { return new Date(s).toLocaleDateString("es-CO", { day:"numeric", month:"short", year:"numeric" }); } catch { return ""; } };
  const inicial = (nombre) => (nombre || "C").trim().charAt(0).toUpperCase();

  async function cargar() {
    let data;
    try {
      const r = await fetch("/api/opiniones");
      data = await r.json();
    } catch { data = { opiniones: [] }; }

    const lista = data.opiniones || [];
    const s = data.stats;
    if (s && s.total) {
      const stats = $("#stats"); stats.style.display = "flex";
      const partes = [];
      if (s.servicio != null) partes.push(`<div class="stat"><b>${s.servicio.toFixed(1)}★</b><span>Servicio</span></div>`);
      if (s.producto != null) partes.push(`<div class="stat"><b>${s.producto.toFixed(1)}★</b><span>Producto</span></div>`);
      if (s.volveria != null) partes.push(`<div class="stat"><b>${s.volveria}%</b><span>Volvería a comprar</span></div>`);
      partes.push(`<div class="stat"><b>${s.total}</b><span>Opiniones</span></div>`);
      stats.innerHTML = partes.join("");
    }

    const cont = $("#cards");
    if (!lista.length) {
      cont.innerHTML = `<div class="empty"><p>Aún no hay opiniones publicadas.</p><p><b>¡Sé el primero!</b> <a href="/opinar">Deja tu opinión aquí</a>.</p></div>`;
      return;
    }
    cont.innerHTML = lista.map((o) => {
      const prom = o.servicio && o.producto ? Math.round((o.servicio + o.producto) / 2) : (o.servicio || o.producto || 0);
      return `<article class="rev">
        <div class="rev__head">
          <div class="rev__avatar">${inicial(o.nombre)}</div>
          <div>
            <div class="rev__name">${(o.nombre || "Cliente").replace(/</g,"&lt;")}</div>
            <div class="rev__stars" aria-label="${prom} de 5">${estrellas(prom)}</div>
          </div>
          <div class="rev__date">${fecha(o.creado)}</div>
        </div>
        ${o.opinion ? `<p class="rev__text">${o.opinion.replace(/</g,"&lt;")}</p>` : ""}
        ${o.volveria ? `<span class="rev__badge">👍 Volvería a comprar</span>` : ""}
      </article>`;
    }).join("");
  }
  cargar();
</script>
</body>
</html>
